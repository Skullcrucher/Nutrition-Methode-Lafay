<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lafay Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concept : un carnet de bord à onglets ; kcal en chiffres mono bien visibles, repas en cartes, tout renvoie aux pages du livre. */
:root{--bg:#f3f5f4;--panel:#ffffff;--fg:#1d2b27;--mute:#5b6b66;--line:#d7dfdc;--accent:#1f6f5c;--accent-fg:#ffffff;--kcal:#b4570a;--soft:#e4efec;--warn:#9a3412;--warn-bg:#fdeee3;--chg:#dbeafe;
--ff-d:"Bricolage Grotesque",system-ui,sans-serif;--ff-b:"Source Sans 3",system-ui,sans-serif;--ff-m:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a18;--panel:#1a2522;--fg:#e6efec;--mute:#9db0aa;--line:#2c3a36;--accent:#58c4a8;--accent-fg:#0c1412;--kcal:#f0a35c;--soft:#223330;--warn:#f4a27a;--warn-bg:#33231a;--chg:#1e3350;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a18;--panel:#1a2522;--fg:#e6efec;--mute:#9db0aa;--line:#2c3a36;--accent:#58c4a8;--accent-fg:#0c1412;--kcal:#f0a35c;--soft:#223330;--warn:#f4a27a;--warn-bg:#33231a;--chg:#1e3350;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--ff-b);font-size:15px;line-height:1.5;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--ff-d);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:26px}h2{font-size:21px;margin-bottom:10px}h3{font-size:16px}
header{padding:18px 0 10px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
header small{color:var(--mute)}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding:6px 0}
nav button{flex:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px}
button:hover{border-color:var(--accent)}
button.on,nav button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.ghost{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.sec{margin-top:22px}
.mono,.kc{font-family:var(--ff_m,var(--ff-m));font-variant-numeric:tabular-nums}
.kc{color:var(--kcal);font-weight:500}
.big{font-size:30px;line-height:1}
.muted{color:var(--mute)}.small{font-size:13px}
.pg{font-family:var(--ff-m);font-size:12px;color:var(--mute);white-space:nowrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--ff-m);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600}
tr.chg td{background:var(--chg)}
tr.tot td{font-weight:600;border-bottom:2px solid var(--line)}
.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mute)}
.note{background:var(--soft);border-radius:8px;padding:10px 12px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px}
.mx td,.mx th{text-align:center;padding:3px 4px}
.mx button{padding:3px 8px;min-width:34px}
.mx td:first-child{font-family:var(--ff-m);text-align:right}
.meal h3{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;justify-content:space-between}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}
ul{margin:6px 0;padding-left:20px}
.day{display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}

/* Version smartphone : barre d'onglets en bas, cibles tactiles larges */
body{font-size:16px;padding-bottom:96px}
header{padding:12px 0 4px}header small{display:none}h1{font-size:22px}
nav{position:fixed;top:auto;left:0;right:0;bottom:0;border-top:1px solid var(--line);border-bottom:0;background:var(--panel);padding:4px max(8px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px));gap:2px;overflow:visible;z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:transparent;min-height:54px;padding:4px 2px;font-size:12px;border-radius:8px}
nav button .ic{font-size:20px;line-height:1.2}
nav button.on{background:var(--soft);color:var(--accent)}
button,select,input[type=number],input:not([type]){min-height:44px;font-size:16px}
input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--accent)}
.wide{width:100%;margin-top:10px}
.dayhead,.mealrow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border:0;background:transparent;text-align:left;min-height:48px;padding:6px 2px}
.dayhead b{font-size:17px;font-family:var(--ff-d)}
.mealrow{border-top:1px solid var(--line)}
.mealrow .nm{flex:1;min-width:150px}
.chk{flex-direction:row;align-items:center;gap:10px;margin-top:10px;font-size:15px;color:var(--fg)}
.big-btn{width:100%;text-align:left;padding:16px;font-size:17px}
.sec{margin-top:16px}
</style>
</head>

function tm(me){if(!S.nl)return me;let dP=0,dG=0,dL=0,dK=0;const out=[];
 for(const i of me.ings){const q=parseFloat(String(i.qty).replace(",","."))||0;
  if(/^\*?lait écrémé/i.test(i.name)&&q>0){const f=q/100,M=MILK[S.nlt];const ni={name:M.n+" (remplace le lait écrémé, p.229)",qty:r1(M.q*f)+" "+M.u,P:r1(M.P*f),G:r1(M.G*f),L:r1(M.L*f),kcal:r1(M.k*f),changed:true};
   dP+=ni.P-i.P;dG+=ni.G-i.G;dL+=ni.L-i.L;dK+=ni.kcal-i.kcal;out.push(ni)}

 function dfs(d,cost){if(cost>=best)return;if(d===7){best=cost;bs=seq.slice();return}

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.tab){S.tab=d.tab}
 else if(d.go){S.tab=d.go;if(d.k){S.mk=+d.k;const ks=kcalsOf(S.mt,S.mr);if(!ks.includes(S.mk)){const f=FORMATS.find(([t,r])=>menuOf(t,r,S.mk));if(f){S.mt=f[0];S.mr=f[1]}}}}
 else if(d.pick){const[t,r,k]=d.pick.split("|");S.mt=t;S.mr=+r;S.mk=+k}
 else if(d.mk){S.mk=+d.mk}
 else if(d.useweek){S.tab="semaine"}
 else if(d.addal!==undefined){S.aliments.push({n:"",q:100,P:0,G:0,L:0})}
 else if(d.delal){S.aliments.splice(+d.delal,1);if(!S.aliments.length)S.aliments.push({n:"",q:100,P:0,G:0,L:0})}
 else if(d.usetot!==undefined){S.p.apport=Math.round(S.aliments.reduce((s,a)=>s+4*a.P*a.q/100+4*a.G*a.q/100+9*a.L*a.q/100,0))}
 else if(d.cas){S.p.casDej=d.cas}
 else if(d.copylist!==undefined){const ta=document.getElementById('copybox');const txt=ta?ta.value:'';const ok=()=>{b.textContent='Copié ✓'};try{navigator.clipboard.writeText(txt).then(ok,()=>{ta.select();document.execCommand('copy');ok()})}catch(e){try{ta.select();document.execCommand('copy');ok()}catch(_){}}return}
 else if(d.clearck!==undefined){S.ck={}}
 else if(d.auto!==undefined){const w=autoWeek(S.auto.k,S.auto.type,S.auto.r);if(w){S.week=w;S.open=null;S.joker=null}}
 else if(d.wr){const p=d.wr.split('|');S.wr[p[0]+'|'+p[1]+'|'+p[2]]=+p[3]}
 else if(d.rec){S.rec=+d.rec;S.rk=null}
 else if(d.rk){S.rk=+d.rk.split("|")[0]}
 else if(d.open){S.open=S.open===d.open?null:d.open}
 else if(d.joker){const[i,j]=d.joker.split("|").map(Number);S.joker=S.joker&&S.joker.d===i&&S.joker.m===j?null:{d:i,m:j}}
 else if(d.repl){const[i,j,pal,nm,pg]=d.repl.split("|");const f=findVariant(nm,+pal);const v=f&&f.v;
  S.week[+i].ov[+j]=v?{name:f.r.name+" ("+pal+" kcal)",page:v.page||f.r.page,tot:v.tot,ings:v.ings}:{name:nm+" ("+pal+" kcal)",page:+pg||0,tot:[0,0,0,+pal],ings:null}}
 else if(d.unrepl){const[i,j]=d.unrepl.split("|").map(Number);delete S.week[i].ov[j]}
 else return;
 save();render();if(d.tab)window.scrollTo(0,0)});
document.addEventListener("change",e=>{const t=e.target,id=t.id;const P=S.p;
 if(id==="f-obj")P.objectif=t.value;else if(id==="f-prin")P.principe=t.value;else if(id==="f-cas"){P.cas=t.value;if(t.value==="enceinte")P.sexe="F"}else if(id==="f-sexe")P.sexe=t.value;
 else if(id==="f-nap")P.nap=+t.value;else if(id==="f-age")P.age=+t.value;else if(id==="f-poids")P.poids=+t.value;else if(id==="f-taille")P.taille=+t.value;
 else if(id==="f-apport")P.apport=t.value;else if(id==="f-pk")S.pk=+t.value;
 else if(t.dataset.ck!==undefined){if(t.checked)S.ck[t.dataset.ck]=1;else delete S.ck[t.dataset.ck]}
 else if(id==="nl")S.nl=t.checked;else if(id==="nlt")S.nlt=t.value;
 else if(id==="a-k")S.auto.k=+t.value;else if(id==="a-type")S.auto.type=t.value;else if(id==="a-r")S.auto.r=+t.value;
 else if(t.dataset.al!==undefined){const a=S.aliments[+t.dataset.al];a[t.dataset.f]=t.dataset.f==="n"?t.value:+t.value}
 else if(t.dataset.wf!==undefined){const d=S.week[+t.dataset.wf];const[tt,r]=t.value.split("|");d.t=tt;d.r=+r;const ks=kcalsOf(tt,+r);if(!ks.includes(d.k))d.k=nearest(d.k,ks);d.ov={}}

 const gen=`<div class="card"><h3>Ma semaine</h3><div class="grid g3" style="margin-top:8px"><label>Apport (kcal)<select id="a-k">${ALLK.map(k=>`<option ${k===A.k?"selected":""}>${k}</option>`).join("")}</select></label>

 <p class="small muted">Moyenne : <span class="kc">${Math.round(tot.reduce((a,b)=>a+b,0)/7)} kcal</span> par jour</p></div>`;
 const days=S.week.map((d,i)=>{const ks=kcalsOf(d.t,d.r);const o=S.od===i;
  const body=o?`<div class="row" style="margin:6px 0"><select data-wf="${i}" aria-label="Format">${FORMATS.map(([t,r])=>`<option value="${t}|${r}" ${t===d.t&&r===d.r?"selected":""}>${fmt(t,r)}</option>`).join("")}</select><select data-wk="${i}" aria-label="Apport">${ks.map(k=>`<option ${k===d.k?"selected":""}>${k}</option>`).join("")}</select></div>
  ${dayMeals(d).map((x,j)=>{const jk=S.joker&&S.joker.d===i&&S.joker.m===j;const t=x.ov?x.ov.tot[3]:x.me.total[3];const isOpen=S.open===i+"|"+j;
   return `<div><button class="mealrow" data-open="${i}|${j}"><span class="nm"><span class="lab">${esc(x.me.label)}</span><br>${esc(x.ov?x.ov.name:x.me.recipe)}${x.ov?" (remplacé)":""}</span><span class="kc">${jk?"Joker":Math.round(t)+" kcal"}</span></button>
   ${isOpen?`<div style="margin:6px 0"><button class="${jk?"on":""}" data-joker="${i}|${j}">${jk?"Joker activé":"Marquer ce repas comme joker"}</button></div>${panel(i,j)}`:""}</div>`}).join("")}`:"";
  return `<div class="card" style="padding:8px 12px"><button class="dayhead" data-od="${i}"><b>${DAYS[i]}</b><span class="pill">${fmt(d.t,d.r)}</span><span class="kc">${Math.round(tot[i])} kcal ${o?"▴":"▾"}</span></button>${body}</div>`}).join("");
 return gen+`<div class="grid sec">${days}</div>`};

S.tab="semaine";
